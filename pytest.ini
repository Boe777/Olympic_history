[pytest]
pythonpath = src
testpaths = tests
python_files = test_*.py
addopts = -q --cov=olympics --cov-report=term-missing --cov-fail-under=85

# A warning is a future failure. UserWarning is where SciPy reports that a
# statistical assumption is shaky, so it must not pass silently. Library
# deprecation noise is left as a warning rather than a failure.
filterwarnings =
    error::UserWarning
    default::DeprecationWarning
    default::FutureWarning
